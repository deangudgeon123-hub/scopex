name: Build check

on:
  push:
    branches:
      - main
      - 'stage3/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Test database boundaries and scanner
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
